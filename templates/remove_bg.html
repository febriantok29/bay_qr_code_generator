{% extends "base.html" %}
{% from "_macros.html" import page_head %}
{% block title %}Remove Background{% endblock %}
{% block content %}
{{ page_head('.BG', 'Remove Background', 'layers') }}
<div class="row">
  <div><label>Gambar<input id="file" type="file"></label></div>
  <div><label>Warna baru<input id="target" type="color" value="#ffffff"></label></div>
  <div><label>Tolerance <span id="amount">30</span><input id="tolerance" type="range" min="0" max="100" value="30"></label></div>
  <div><label>Format output
    <select id="format">
      {% for ext in formats %}<option value="{{ ext }}">{{ ext }}</option>{% endfor %}
    </select>
  </label></div>
  <div><button id="save" disabled>Save As</button></div>
</div>
<canvas id="canvas"></canvas>
<p id="status">Pilih gambar. Pixel kiri-atas dipakai sebagai warna background awal.</p>
<script>
const file=document.querySelector('#file'),target=document.querySelector('#target'),tolerance=document.querySelector('#tolerance'),amount=document.querySelector('#amount'),format=document.querySelector('#format'),save=document.querySelector('#save'),canvas=document.querySelector('#canvas'),status=document.querySelector('#status'),ctx=canvas.getContext('2d');
let originalData='',originalImage=null,source=[255,255,255],timer;
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const request=async(data)=>{const response=await fetch('{{ url_for("remove_bg_process") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error);return result};
const draw=data=>new Promise(resolve=>{const image=new Image();image.onload=()=>{canvas.width=image.width;canvas.height=image.height;ctx.drawImage(image,0,0);resolve(image)};image.src='data:image/png;base64,'+data});
const process=async()=>{if(!originalData)return;status.textContent='Updating preview…';try{const result=await request({data:originalData,source,target:rgb(target.value),tolerance:+tolerance.value,format:'PNG'});await draw(result.data);status.textContent=`Background RGB(${source.join(', ')}) → ${target.value.toUpperCase()}`}catch(error){status.textContent=error.message}};
file.onchange=async()=>{if(!file.files[0])return;status.textContent='Membuka gambar…';const reader=new FileReader();reader.onload=async()=>{originalData=reader.result.split(',')[1];source=[255,255,255];try{originalImage=await draw(originalData);const off=document.createElement('canvas');off.width=originalImage.width;off.height=originalImage.height;const offctx=off.getContext('2d');offctx.drawImage(originalImage,0,0);source=Array.from(offctx.getImageData(0,0,1,1).data.slice(0,3));save.disabled=false;await process()}catch(error){status.textContent=error.message}};reader.readAsDataURL(file.files[0])};
canvas.onclick=event=>{if(!originalImage)return;const box=canvas.getBoundingClientRect(),x=Math.min(canvas.width-1,Math.floor((event.clientX-box.left)*canvas.width/box.width)),y=Math.min(canvas.height-1,Math.floor((event.clientY-box.top)*canvas.height/box.height)),off=document.createElement('canvas');off.width=originalImage.width;off.height=originalImage.height;const offctx=off.getContext('2d');offctx.drawImage(originalImage,0,0);source=Array.from(offctx.getImageData(x,y,1,1).data.slice(0,3));process()};
tolerance.oninput=()=>{amount.textContent=tolerance.value;clearTimeout(timer);timer=setTimeout(process,150)};target.oninput=process;
save.onclick=async()=>{status.textContent='Menyiapkan download…';try{const result=await request({data:originalData,source,target:rgb(target.value),tolerance:+tolerance.value,format:format.value});const link=document.createElement('a');link.href=`data:${result.mime};base64,${result.data}`;link.download=`background-replaced${result.extension}`;link.click();status.textContent='Tersimpan'}catch(error){status.textContent=error.message}};
</script>
{% endblock %}
