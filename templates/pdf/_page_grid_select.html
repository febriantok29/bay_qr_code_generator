{% macro page_grid_select(picker, field_id, action_url, button_label) %}
<form method="post" action="{{ action_url }}">
  <input type="hidden" name="stage" value="confirm">
  <input type="hidden" name="pdf_data" value="{{ picker.pdf_b64 }}">
  <input type="hidden" name="pdf_name" value="{{ picker.pdf_name }}">

  <p class="hint">Klik halaman yang mau dipilih, atau ketik langsung nomornya di bawah.</p>
  <div class="page-grid">
    {% for page in picker.pages %}
    <label class="page-thumb">
      <input type="checkbox" class="page-check" value="{{ page.page }}"
        onchange="
          const vals = Array.from(this.form.querySelectorAll('.page-check:checked')).map(c => c.value);
          this.form.querySelector('#{{ field_id }}').value = vals.join(' ');
        ">
      <img src="{{ page.data_uri }}" alt="Halaman {{ page.page }}">
      <span>{{ page.page }}</span>
    </label>
    {% endfor %}
  </div>

  <label for="{{ field_id }}">Nomor halaman terpilih</label>
  <input type="text" id="{{ field_id }}" name="pages" placeholder="1 3 5">

  <label for="filename_{{ field_id }}">Nama file (opsional)</label>
  <input type="text" id="filename_{{ field_id }}" name="filename" placeholder="Kosongkan untuk nama otomatis">

  <button type="submit">{{ button_label }}</button>
</form>
{% endmacro %}
